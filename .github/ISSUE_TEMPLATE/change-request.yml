name: Change request
description: Raise an obstacle that keeps actors from using swiyu
title: "[CR] "
labels: ["change-request", "status: discussion", "needs-steward"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the obstacle and what should become possible. The swiyu team decides how to solve it, so a
        technical solution is not needed. A steward is assigned; the working groups of the affected sectors are
        consulted and their councils decide before DIDAS submits anything (see GOVERNANCE.md and ASPECTS.md).
        Link the swiyu specification or code for every statement about how swiyu works.
        **Do not report security vulnerabilities here.**
  - type: dropdown
    id: aspect
    attributes:
      label: Primary aspect
      description: The kind of obstacle the requested outcome addresses. See ASPECTS.md.
      options:
        - "Costs for actors: fees, integration or operating effort"
        - "Constraints of use: a rule or limit excludes a legitimate use"
        - "Technological hurdles: implementation is hard or impossible for some actors"
        - "Organisational hurdles: onboarding, manual steps, lead times, responsibilities"
        - "Governance and trust framework: who decides, and whether that body can act within swiyu"
        - "Technological improvements: a capability the ecosystem needs is missing"
        - "Defects: errors or contradictions that affect several actors"
        - "Infrastructure: registries, status lists, environments, availability, operation"
        - "Law and ordinances: a provision of the E-ID Act or its ordinances, for later revisions"
        - "Interoperability: divergence from international standards or other ecosystems"
        - "Documentation: gaps or contradictions in the swiyu documentation"
    validations:
      required: true
  - type: dropdown
    id: secondary-aspects
    attributes:
      label: Secondary aspects
      multiple: true
      options:
        - Costs for actors
        - Constraints of use
        - Technological hurdles
        - Organisational hurdles
        - Governance and trust framework
        - Technological improvements
        - Defects
        - Infrastructure
        - Law and ordinances
        - Interoperability
        - Documentation
  - type: dropdown
    id: role
    attributes:
      label: Your role
      multiple: true
      options:
        - Issuer
        - Verifier / relying party
        - Wallet provider
        - Integrator / solution vendor
        - Governing authority (federal, cantonal, sectoral)
        - Infrastructure operator
        - Other
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What do actors run into today? Depending on the aspect: who pays or works for what; which use is excluded
        and by which rule; what blocks an implementation; which process step delays; who should decide and cannot;
        which capability is missing; which defect; which legal provision. Link the specification or code in
        github.com/swiyu-admin-ch for every statement about swiyu.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Who is affected
      description: Which actors, and how? Effort, cost, delay, excluded use cases.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Requested outcome
      description: What should become possible, and for whom? The result, not the technical solution.
    validations:
      required: true
  - type: dropdown
    id: sectors
    attributes:
      label: Sectors affected
      description: Their working groups are consulted and their councils decide. The steward confirms.
      multiple: true
      options:
        - Banking
        - Insurance
        - Health
        - Pharma
        - Public Sector
        - Education
        - Retail (eCommerce & Retail)
        - Mobility
        - Hospitality
        - Industry & Manufacturing
        - Digital & Telecom
        - Energy & Utilities
        - Real Estate
        - Sport
        - Cross-sector / all
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Use cases, trust flows or deployments that show the problem.
  - type: dropdown
    id: urgency
    attributes:
      label: Timing
      description: Is there a deadline (specification freeze, release, consultation, legislative process) that may require an early notice?
      options:
        - No known deadline
        - Deadline known (describe under Evidence)
  - type: textarea
    id: interests
    attributes:
      label: Disclosure of interests
      description: Commercial or organisational interests relevant to this topic.
  - type: checkboxes
    id: coauthor
    attributes:
      label: Contribution
      options:
        - label: I am willing to help write the change request
        - label: I am willing to act as steward (if I am a DIDAS steward)
